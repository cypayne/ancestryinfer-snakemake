genome1: xbir-COAC-16-VIII-22-M_v2023.1.fa 
genome2: xmal-CHIC-XI-20-M_v2023.2.fa 

read_type: PE
read_list: read_list_ex.txt 
read_length: 150

prop_genome_genome1_parent: 0.5
number_indiv_per_job: 1
program_path: /home/groups/schumer/shared_bin/ancestryinfer_July2022 
provide_AIMs: Xbirchmanni_Xmalinche_aims_v2_pacbio_v2023.1.txt 
provide_counts: Xbirchmanni_Xmalinche_parental_counts_v2_pacbio_v2023.1.txt 

per_site_error: 0.02
gen_initial_admix: 40
focal_chrom_list: 
rec_M_per_bp: 0.00000002 
max_alignments: 2000000
posterior_thresh: 0.9

retain_intermediate_files: 1

# trim reads before mapping?
trim_reads: False

## for trimming reads, set parameters
params:
    fastp:
        # See fastp manual for adding additional options, e.g. for adapter trimming.
        - " --adapter_sequence=AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
        - " --adapter_sequence_r2=AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT"
        - " --detect_adapter_for_pe --cut_right --cut_right_window_size 4 --cut_right_mean_quality 20 "
